apiVersion: v1
kind: Service
metadata:
  name: kubenotes
  labels:
    app.kubernetes.io/name: kubenotes
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kubenotes
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080                          # each overlay sets its own
