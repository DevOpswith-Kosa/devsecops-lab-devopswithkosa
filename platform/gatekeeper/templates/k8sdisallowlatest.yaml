# Images must be pinned to a version or digest, never :latest.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowlatest
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowLatest

  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowlatest

        # Works for Pods and for anything with a pod template (Deployments...).
        pod_spec := s {
          input.review.object.kind == "Pod"
          s := input.review.object.spec
        }
        pod_spec := s {
          input.review.object.kind != "Pod"
          s := input.review.object.spec.template.spec
        }
        containers[c] { c := pod_spec.containers[_] }
        containers[c] { c := pod_spec.initContainers[_] }
        name := sprintf("%s/%s", [input.review.object.kind, input.review.object.metadata.name])

        violation[{"msg": msg}] {
          c := containers[_]
          endswith(c.image, ":latest")
          msg := sprintf("[IMG-002] %s: image %q uses :latest", [name, c.image])
        }
        violation[{"msg": msg}] {
          c := containers[_]
          not contains(c.image, "@")
          not regex.match(`:[^/]+$`, c.image)
          msg := sprintf("[IMG-002] %s: image %q has no tag or digest", [name, c.image])
        }
