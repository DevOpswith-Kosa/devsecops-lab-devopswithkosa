# ======================================================================
# PART 3 -- secure CI. Runs the SAME `make` targets you run locally, so
# "green locally" means "green in CI". Every scanner is a gate.
# Actions are pinned to a commit SHA (the comment shows the version).
# ======================================================================
name: 20 - CI (secure)

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the repo and upload
# SARIF to the Security tab. Nothing else.
permissions:
  contents: read

jobs:
  security-scans:
    runs-on: [self-hosted, devsecops]   # the scanners run as pinned containers
    permissions:
      contents: read
      security-events: write            # to upload SARIF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0                # gitleaks scans the whole history
          persist-credentials: false    # don't leave a token in .git/config
      - name: Secrets, SAST, SCA, IaC/policy
        run: make scan
      - name: Pipeline hygiene (actionlint + zizmor)
        run: make scan-workflows
      - name: "K8s config posture (Kubescape: NSA + MITRE)"
        run: make scan-config
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-reports
          path: reports/
          retention-days: 7

  build-and-sign:
    needs: security-scans
    runs-on: [self-hosted, devsecops]
    permissions:
      contents: read
      id-token: write                   # keyless cosign signing
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, push, scan the image, make an SBOM
        id: build
        run: |
          make build push
          make scan-image sbom
          SHA=$(git rev-parse --short=12 HEAD)
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "localhost:5001/kubenotes:$SHA" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "built localhost:5001/kubenotes@$digest"
      - name: Sign the image (keyless, tied to this repo)
        if: github.ref == 'refs/heads/main'
        run: ci/sign.sh "localhost:5001/kubenotes@${{ steps.build.outputs.digest }}"
      - name: Upload image report + SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-and-sbom
          path: |
            reports/trivy-image.sarif
            reports/sbom.cdx.json
          retention-days: 7
